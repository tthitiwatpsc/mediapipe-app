<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Face Landmarker</title>
  <style>
    body {
      font-family: sans-serif;
      background: #222;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    #status {
      margin-bottom: 20px;
      font-weight: bold;
      font-size: 1.2rem;
    }
    #container {
      position: relative;
      width: 640px;
      height: 480px;
      background: black;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 640px;
      height: 480px;
      transform: scaleX(-1);
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #4CAF50;
      color: white;
      font-weight: bold;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <h1>Real-Time Face Detection</h1>
  <div id="status">กำลังโหลดระบบ...</div>

  <div id="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <div style="margin-top: 15px;">
    <button id="captureBtn">📸 บันทึก Face Embedding</button>
  </div>
  <div id="dbStatus" style="margin-top: 10px; color: yellow;"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
